<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Модель ВАЗ</title>
    <!-- Подключаем скрипт для работы 3D-плеера -->
    <script src="./skript.js"></script>
    <style>
        body {
            margin: 0;
            background-color: #f0f0f0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        model-viewer {
            width: 100%;
            height: 100%;
            max-width: 800px;
            max-height: 600px;
            background-color: #ffffff;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>

    <!-- Компонент отображения 3D-модели -->
    <model-viewer 
        src="vaz-v3.glb" 
        alt="3D модель ВАЗ" 
        auto-rotate 
        camera-controls 
        ar>
    </model-viewer>

</body>
</html>
